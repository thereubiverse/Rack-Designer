# Render blueprint. Create the service from this file rather than by hand, so the configuration
# lives in the repository and a rebuild cannot quietly differ from what is written down.
#
# Docker, not Render's native Node runtime: @napi-rs/canvas ships a platform-specific native binary
# that rasterises PDF pages for symbol discovery, and the Dockerfile installs it for Linux at build
# time. See docs/reference/deployment.md.
services:
  - type: web
    name: network-doc-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 512MB. PDF rasterisation is the memory-hungry part; raise if it OOMs.
    region: ohio           # Put the Supabase project in the same region — every page render makes
                           # several round trips, and cross-region latency multiplies through them.
    healthCheckPath: /login # The only route reachable without a session. `/` redirects, which a
                            # health check would follow into the auth gate and report as a failure.
    autoDeployTrigger: commit

    envVars:
      # sync: false means "do not read from this file" — set the value in Render's dashboard, where
      # it is encrypted. None of these may ever be written here: this repository is public.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Must match site_url in supabase/config.toml, or OAuth redirects and emailed links disagree.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Optional. Each feature explains itself in the UI while its credentials are absent, rather
      # than failing obscurely, so the app is usable before any of these exist.
      - key: RESEND_SMTP_PASSWORD      # member invites and password recovery
        sync: false
      - key: GEMINI_API_KEY            # Device Wizard and plan discovery
        sync: false
      - key: SUPABASE_AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_AUTH_GOOGLE_SECRET
        sync: false
      - key: SUPABASE_AUTH_AZURE_CLIENT_ID
        sync: false
      - key: SUPABASE_AUTH_AZURE_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID        # phone verification
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
